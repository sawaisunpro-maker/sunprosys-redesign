<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 産業用ロボットアーム（6軸） -->
  <symbol id="pic-robot-arm" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="54" width="24" height="6"/>
      <circle cx="32" cy="50" r="4"/>
      <line x1="32" y1="50" x2="24" y2="32" stroke-width="5"/>
      <circle cx="24" cy="32" r="3.5"/>
      <line x1="24" y1="32" x2="46" y2="22" stroke-width="4.5"/>
      <circle cx="46" cy="22" r="3"/>
      <line x1="46" y1="22" x2="54" y2="12" stroke-width="2.5"/>
      <rect x="50" y="6" width="8" height="6"/>
    </g>
  </symbol>

  <!-- 協働ロボット（cobot, スリム） -->
  <symbol id="pic-cobot" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="32" cy="56" rx="14" ry="3"/>
      <line x1="32" y1="54" x2="32" y2="36" stroke-width="6"/>
      <circle cx="32" cy="36" r="4"/>
      <path d="M32 36 Q 20 28 18 18" stroke-width="4"/>
      <circle cx="18" cy="18" r="3"/>
      <path d="M18 18 Q 28 12 42 14" stroke-width="3"/>
      <circle cx="42" cy="14" r="2.5"/>
      <line x1="42" y1="14" x2="48" y2="8" stroke-width="2"/>
    </g>
  </symbol>

  <!-- グリッパー（エンドエフェクタ） -->
  <symbol id="pic-gripper" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="26" y="10" width="12" height="14" rx="2"/>
      <line x1="32" y1="24" x2="32" y2="30"/>
      <path d="M26 30 L20 50 L26 52" stroke-width="2.5"/>
      <path d="M38 30 L44 50 L38 52" stroke-width="2.5"/>
      <rect x="18" y="50" width="10" height="4" rx="1"/>
      <rect x="36" y="50" width="10" height="4" rx="1"/>
    </g>
  </symbol>

  <!-- AGV / 無人搬送車 -->
  <symbol id="pic-agv" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="22" width="48" height="20" rx="3"/>
      <line x1="14" y1="32" x2="50" y2="32" stroke-dasharray="3 3"/>
      <circle cx="18" cy="48" r="6"/>
      <circle cx="46" cy="48" r="6"/>
      <rect x="20" y="14" width="24" height="8" rx="1" fill="currentColor" opacity=".35"/>
    </g>
  </symbol>

  <!-- 検査カメラ / ビジョンシステム -->
  <symbol id="pic-camera" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="22" width="44" height="28" rx="3"/>
      <circle cx="32" cy="36" r="9"/>
      <circle cx="32" cy="36" r="5"/>
      <rect x="20" y="14" width="12" height="8" rx="1"/>
      <circle cx="46" cy="28" r="1.5" fill="currentColor"/>
    </g>
  </symbol>

  <!-- 制御盤 / PLC -->
  <symbol id="pic-plc" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="8" width="44" height="48" rx="2"/>
      <line x1="10" y1="20" x2="54" y2="20"/>
      <circle cx="18" cy="14" r="1.5" fill="currentColor"/>
      <circle cx="24" cy="14" r="1.5" fill="currentColor"/>
      <rect x="16" y="26" width="32" height="8" rx="1"/>
      <line x1="16" y1="42" x2="48" y2="42"/>
      <line x1="16" y1="48" x2="48" y2="48"/>
      <rect x="16" y="42" width="6" height="8" fill="currentColor" opacity=".4"/>
    </g>
  </symbol>

  <!-- HMI / タッチパネル -->
  <symbol id="pic-hmi" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="52" height="36" rx="3"/>
      <rect x="12" y="16" width="40" height="24" rx="1" fill="currentColor" opacity=".15"/>
      <line x1="18" y1="22" x2="34" y2="22"/>
      <line x1="18" y1="28" x2="30" y2="28"/>
      <rect x="38" y="22" width="10" height="14" rx="1"/>
      <line x1="20" y1="50" x2="44" y2="50"/>
      <line x1="26" y1="46" x2="38" y2="46"/>
    </g>
  </symbol>

  <!-- センサー -->
  <symbol id="pic-sensor" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="16" width="20" height="34" rx="2"/>
      <circle cx="32" cy="26" r="5" fill="currentColor" opacity=".3"/>
      <circle cx="32" cy="26" r="2.5" fill="currentColor"/>
      <line x1="32" y1="50" x2="32" y2="58"/>
      <path d="M14 26 Q 8 26 6 32" stroke-dasharray="2 2"/>
      <path d="M50 26 Q 56 26 58 32" stroke-dasharray="2 2"/>
    </g>
  </symbol>

  <!-- サーボモーター -->
  <symbol id="pic-servo" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="18"/>
      <circle cx="32" cy="32" r="4" fill="currentColor"/>
      <line x1="32" y1="14" x2="32" y2="6"/>
      <line x1="32" y1="50" x2="32" y2="58"/>
      <line x1="14" y1="32" x2="6" y2="32"/>
      <line x1="50" y1="32" x2="58" y2="32"/>
      <path d="M32 32 L44 24" stroke-width="3"/>
    </g>
  </symbol>

  <!-- 歯車（シンプル） -->
  <symbol id="pic-gear" viewBox="0 0 64 64">
    <g fill="currentColor">
      <path d="M32 18a14 14 0 1 0 0 28 14 14 0 0 0 0-28zm0 22a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/>
      <path d="M32 4l2 8h-4l2-8zm0 56l2-8h-4l2 8zm28-28l-8 2v-4l8 2zm-56 0l8-2v4l-8-2zm49-21l-5 6-3-3 8-3zm-42 42l-5 6-3-3 8-3zm45 0l6 5-3 3-3-8zm-42-42l6 5-3 3-3-8z"/>
    </g>
  </symbol>

  <!-- 回路基板 / PCB -->
  <symbol id="pic-pcb" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="52" height="44" rx="2"/>
      <circle cx="14" cy="18" r="1.5" fill="currentColor"/>
      <circle cx="50" cy="18" r="1.5" fill="currentColor"/>
      <circle cx="14" cy="46" r="1.5" fill="currentColor"/>
      <circle cx="50" cy="46" r="1.5" fill="currentColor"/>
      <rect x="20" y="22" width="14" height="10" rx="1"/>
      <rect x="38" y="34" width="14" height="10" rx="1"/>
      <line x1="14" y1="18" x2="20" y2="22"/>
      <line x1="34" y1="32" x2="38" y2="34"/>
      <line x1="50" y1="46" x2="52" y2="44"/>
      <line x1="14" y1="46" x2="20" y2="32"/>
    </g>
  </symbol>

  <!-- コードブラケット { } -->
  <symbol id="pic-code" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12 Q 14 12 14 20 L 14 28 Q 14 32 10 32 Q 14 32 14 36 L 14 44 Q 14 52 22 52"/>
      <path d="M42 12 Q 50 12 50 20 L 50 28 Q 50 32 54 32 Q 50 32 50 36 L 50 44 Q 50 52 42 52"/>
      <path d="M27 22 L 31 42 M 33 32 L 37 32" opacity=".7"/>
    </g>
  </symbol>

  <!-- コンベア -->
  <symbol id="pic-conveyor" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="32" width="52" height="10" rx="5"/>
      <circle cx="14" cy="37" r="2" fill="currentColor"/>
      <circle cx="50" cy="37" r="2" fill="currentColor"/>
      <rect x="22" y="20" width="10" height="10" fill="currentColor" opacity=".4"/>
      <rect x="36" y="20" width="10" height="10" fill="currentColor" opacity=".25"/>
      <path d="M10 50 L 18 50" stroke-width="3"/>
      <path d="M26 50 L 34 50" stroke-width="3"/>
      <path d="M42 50 L 50 50" stroke-width="3"/>
    </g>
  </symbol>

  <!-- 溶接（welding） -->
  <symbol id="pic-welding" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 8 L 36 8 L 40 18 L 46 28 L 40 36 L 30 38 L 24 30 Z" fill="currentColor" opacity=".25"/>
      <line x1="40" y1="36" x2="50" y2="50" stroke-width="3"/>
      <path d="M20 50 L 28 42 L 24 50 L 32 50 L 24 56" fill="currentColor"/>
    </g>
  </symbol>

  <!-- レンチ / メンテナンス -->
  <symbol id="pic-wrench" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 10 a8 8 0 0 0 -10 11 L 16 39 a4 4 0 0 0 0 6 l 3 3 a 4 4 0 0 0 6 0 L 43 30 a 8 8 0 0 0 11 -10 L 49 25 L 44 20 Z" fill="currentColor" opacity=".3"/>
    </g>
  </symbol>

  <!-- ライン（生産ライン） -->
  <symbol id="pic-line" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="20" width="14" height="24" rx="2"/>
      <rect x="25" y="20" width="14" height="24" rx="2"/>
      <rect x="44" y="20" width="14" height="24" rx="2"/>
      <line x1="20" y1="32" x2="25" y2="32" stroke-width="3"/>
      <line x1="39" y1="32" x2="44" y2="32" stroke-width="3"/>
      <circle cx="13" cy="32" r="3"/>
      <circle cx="32" cy="32" r="3" fill="currentColor"/>
      <circle cx="51" cy="32" r="3"/>
    </g>
  </symbol>

  <!-- レーザー印字 -->
  <symbol id="pic-laser" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="8" width="24" height="14" rx="2"/>
      <line x1="32" y1="22" x2="32" y2="40" stroke-width="3" stroke-dasharray="4 3"/>
      <path d="M22 44 L 42 44 L 38 56 L 26 56 Z" fill="currentColor" opacity=".15"/>
      <text x="32" y="54" text-anchor="middle" font-size="6" fill="currentColor" font-family="Inter">QR</text>
    </g>
  </symbol>

  <!-- 警告 / 安全 -->
  <symbol id="pic-safety" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 8 L 56 50 L 8 50 Z" fill="currentColor" opacity=".15"/>
      <line x1="32" y1="22" x2="32" y2="38"/>
      <circle cx="32" cy="44" r="1.5" fill="currentColor"/>
    </g>
  </symbol>

</svg>
